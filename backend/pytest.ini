[pytest]
testpaths = tests

# These two files were written for a different version of the code
# (they import analyze_nutrition, parse_serving and OpenFoodFactsError,
# which do not exist in this project). Rewrite or delete them later,
# then remove these two --ignore options.
addopts = --ignore=tests/test_analyzers.py --ignore=tests/test_api.py

filterwarnings =
    ignore::DeprecationWarning
    ignore:Using .httpx. with .starlette.testclient.*:Warning